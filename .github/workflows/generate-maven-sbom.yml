name: Generate Maven SBOM

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        default: "master"
        required: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRO: "temurin"
  PRODUCT_PATH: "org.eclipse.sirius.emfjson"
  PLUGIN_VERSION: "2.9.1"
  SBOM_TYPE: "makeAggregateBom"
  GITHUB_REF: ${{ github.ref }}
  INPUTS_VERSION: ${{ inputs.version }}

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ env.INPUTS_VERSION }}
          persist-credentials: false

      - name: Setup Java SDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Generate sbom
        env:
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn org.cyclonedx:cyclonedx-maven-plugin:$PLUGIN_VERSION:$SBOM_TYPE -f "$PRODUCT_PATH/pom.xml"

      - name: Extract product version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.metadata.component.version' < ./${{ env.PRODUCT_PATH }}/target/bom.json)"

          # Only a v* release tag yields a clean version, anything else is a
          # development snapshot. A called run builds GITHUB_REF, a manual run
          # builds the ref it was given.
          BUILT_REF="${INPUTS_VERSION:-$GITHUB_REF}"
          if [[ ! "$BUILT_REF" =~ ^(refs/tags/)?v ]]; then
            VERSION="${VERSION}@dev"
          fi

          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Product version: $VERSION"

      - name: Upload SBOM
        uses: eclipse-csi/workflows/upload-sbom@0c1c6cf5cb4dc624a86410274c71b27d6273385a # main
        with:
          sbom-file: ${{ env.PRODUCT_PATH }}/target/bom.json
          product-name: "Sirius EMF JSON"
          product-version: ${{ steps.version.outputs.PROJECT_VERSION }}
